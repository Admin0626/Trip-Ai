spring:
  application:
    name: trip-server
  profiles:
    active: dev
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

trip:
  mail:
    enabled: ${TRIP_MAIL_ENABLED:false}
    from: ${SMTP_FROM:}

# Optional mail must not make the application unhealthy while explicitly disabled.
management:
  health:
    mail:
      enabled: ${TRIP_MAIL_ENABLED:false}

server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-swallow-size: -1

